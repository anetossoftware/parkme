name: Build PROD with Firebase CLI
on:
  push:
    branches:
      - 'release/**'
jobs:
  build:
    name: build Prod Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Get build flavor
        run: |
          ENV=Prod
          echo BUILD_ENV=$ENV >> $GITHUB_ENV

      - name: Decode base64 and save release keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > android-release.keystore
          echo "KEYSTORE_FILE=$PWD/android-release.keystore" >> $GITHUB_ENV
          ls -l $PWD/android-release.keystore

      - name: Verify keystore files
        run: |
          ls -l ${{ env.KEYSTORE_FILE }}
          ls -l $PWD/android-release.keystore

      - name: Set up environment variables
        run: |
          echo BASE_URL=${{ secrets.BASE_URL }}  >> $GITHUB_ENV
          echo MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}  >> $GITHUB_ENV
          echo SHOW_UI_LOG=${{ secrets.SHOW_UI_LOG }} >> $GITHUB_ENV
          echo KEY_ALIAS=${{ secrets.KEY_ALIAS }}  >> $GITHUB_ENV
          echo KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}  >> $GITHUB_ENV

      - name: Get FULL_DATE
        run: |
          echo FULL_DATE=$(TZ="Canada/Eastern" date) >> $GITHUB_ENV

      - name: Get SHORT_DATE
        run: |
          echo SHORT_DATE=$(TZ="Canada/Eastern" date +%Y%m%d%H) >> $GITHUB_ENV

      # this gets the first 6 characters of the git hash, used for labelling
      - name: Get short hash
        run: |
          short=${GITHUB_SHA::6}
          echo SHORT_HASH=$short >> $GITHUB_ENV

      - name: Echo env for logs
        run: |
          echo BUILD_ENV=$BUILD_ENV
          echo SHORT_HASH=$SHORT_HASH

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Gradle
        run: ./gradlew clean

      # For prod should be update to AAB
      - name: Compile and Build
        run: ./gradlew bundle${{ env.BUILD_ENV }}Release

      - name: Show Result files
        run: ls ./app/build/outputs/bundle/prodRelease/

      - name: Install Firebase Tools
        run: curl -sL https://firebase.tools | bash

      - name: Get Firebase Tools Version
        run: firebase --version

        ## For prod should be update to AAB
      - name: Publish App to Firebase App Distribution
        run: firebase appdistribution:distribute
          --token ${{ secrets.FIREBASE_TOKEN }}
          ./app/build/outputs/bundle/prodRelease/app-prod-release.aab
          --app ${{ secrets.FIREBASE_APP_ID }}
          --release-notes "${{ github.event.head_commit.message }}"
          --groups "PROD"
